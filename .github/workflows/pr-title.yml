name: PR title

# Title-only check: runs on PR open/reopen/sync AND on title edits, so a title
# edit re-validates without re-running the full test suite (that lives in ci.yml).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = process.env.PR_TITLE || '';
          const match = title.match(/^([a-z]+)(?:\([^)]+\))?(!)?:\s+.+$/i);
          if (!match) {
            throw new Error(`PR title must use Conventional Commit format, e.g. "fix: handle missing config". Got: ${title}`);
          }

          const type = match[1].toLowerCase();
          const supportedTypes = new Set([
            'feat',
            'fix',
            'perf',
            'revert',
            'docs',
            'ci',
            'chore',
            'test',
            'build',
            'refactor',
            'style',
          ]);
          if (!supportedTypes.has(type)) {
            throw new Error(`Unsupported PR title type "${type}". Supported types: ${[...supportedTypes].join(', ')}`);
          }
          NODE
