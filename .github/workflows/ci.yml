name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to conserve Actions minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: workflow only needs to read the repo
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  integration:
    runs-on: ubuntu-latest
    # Skip on fork PRs: GitHub does not expose repository secrets to forks, so
    # the Spotify credentials would be missing and the suite would fail at setup.
    # Same-repository PRs and pushes to main always have secret access.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build is part of test:integration, but an explicit step makes failures
      # easier to distinguish in the Actions log.
      - name: Build
        run: npm run build

      # Refresh the Spotify token once before tests run.
      #
      # Why this is a separate step (not inside setup.ts):
      #   Spotify rotates PKCE refresh tokens on every refresh call — each call
      #   issues a new refresh_token and invalidates the old one.  If setup.ts
      #   called the refresh endpoint, the GitHub secret would go stale after the
      #   first run.  Instead, this step:
      #     1. Calls the token endpoint with SPOTIFY_REFRESH_TOKEN.
      #     2. Stores the new access_token in INTEGRATION_SPOTIFY_ACCESS_TOKEN
      #        (GITHUB_ENV) so setup.ts can use it directly — no further refresh.
      #     3. If Spotify returned a NEW refresh_token (rotation happened), updates
      #        SPOTIFY_REFRESH_TOKEN in GitHub secrets for the next run via
      #        GH_SECRETS_PAT (a fine-grained PAT with "Secrets: write" permission).
      #        If GH_SECRETS_PAT is not set the step still succeeds but logs a warning.
      #
      # Secret setup (one-time):
      #   SPOTIFY_CLIENT_ID      — Spotify app client ID
      #   SPOTIFY_CLIENT_SECRET  — Spotify app client secret
      #   SPOTIFY_REFRESH_TOKEN  — PKCE refresh token (from `spotify-sync auth`)
      #   GH_SECRETS_PAT         — Fine-grained PAT, Secrets:write on this repo
      #                            (needed to self-update SPOTIFY_REFRESH_TOKEN)
      #
      # See docs/integration-tests.md for full setup instructions.
      - name: Refresh Spotify token
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          # gh CLI reads GH_TOKEN for authentication. Set it to GH_SECRETS_PAT so
          # `gh secret set` can update SPOTIFY_REFRESH_TOKEN when Spotify rotates it.
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl -s -w '\n%{http_code}' -X POST \
            https://accounts.spotify.com/api/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d "grant_type=refresh_token&refresh_token=${SPOTIFY_REFRESH_TOKEN}&client_id=${SPOTIFY_CLIENT_ID}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Spotify token refresh failed (HTTP $HTTP_CODE): $BODY"
            echo "::error::Re-run 'spotify-sync auth' locally, copy the refresh_token from"
            echo "::error::~/.config/spotify-sync/auth.json, and update the SPOTIFY_REFRESH_TOKEN secret."
            exit 1
          fi

          ACCESS_TOKEN=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['access_token'])")
          NEW_REFRESH=$(echo "$BODY"   | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('refresh_token',''))")
          EXPIRES_IN=$(echo "$BODY"   | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('expires_in',3600))")
          EXPIRES_AT=$(python3 -c "import time; print(int((time.time() + ${EXPIRES_IN}) * 1000))")

          # Pass the access_token to subsequent steps via GITHUB_ENV.
          # setup.ts reads INTEGRATION_SPOTIFY_ACCESS_TOKEN and skips the refresh.
          echo "INTEGRATION_SPOTIFY_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
          echo "INTEGRATION_SPOTIFY_ACCESS_TOKEN_EXPIRES_AT=$EXPIRES_AT" >> "$GITHUB_ENV"
          echo "Token obtained, expires_in=${EXPIRES_IN}s"

          # If Spotify rotated the refresh_token, update the GitHub secret so the
          # next run doesn't fail with 400 invalid_grant.
          if [ -n "$NEW_REFRESH" ] && [ "$NEW_REFRESH" != "$SPOTIFY_REFRESH_TOKEN" ]; then
            echo "Spotify rotated the refresh token — updating SPOTIFY_REFRESH_TOKEN secret…"
            if [ -z "${GH_SECRETS_PAT:-}" ]; then
              echo "::warning::GH_SECRETS_PAT is not set — cannot auto-update SPOTIFY_REFRESH_TOKEN."
              echo "::warning::The next CI run will fail until SPOTIFY_REFRESH_TOKEN is updated manually."
              echo "::warning::Add a fine-grained PAT with Secrets:write as GH_SECRETS_PAT."
            else
              echo "$NEW_REFRESH" | gh secret set SPOTIFY_REFRESH_TOKEN \
                --repo "$GITHUB_REPOSITORY"
              echo "SPOTIFY_REFRESH_TOKEN secret updated for the next run."
            fi
          else
            echo "No token rotation — existing SPOTIFY_REFRESH_TOKEN remains valid."
          fi

      - name: Integration tests
        run: npm run test:integration
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_PLAYLIST_URL: ${{ vars.SPOTIFY_PLAYLIST_URL }}
          SPOTIFY_PLAYLIST_URL_SUBSET: ${{ vars.SPOTIFY_PLAYLIST_URL_SUBSET }}
          # INTEGRATION_SPOTIFY_ACCESS_TOKEN and INTEGRATION_SPOTIFY_ACCESS_TOKEN_EXPIRES_AT
          # are already set in GITHUB_ENV by the "Refresh Spotify token" step above.
